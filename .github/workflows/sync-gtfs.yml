# Weekly GTFS cook on a GitHub runner, then upload complete feeds to S3.
# Lightsail pulls from S3 (not SSH). Repo variables: GTFS_S3_BUCKET, AWS_GTFS_SYNC_ROLE_ARN.
name: Sync GTFS

on:
  schedule:
    # GitHub cron is UTC only. 11:00 UTC Sunday = Sunday 3am PST / 4am PDT (Vancouver).
    - cron: "0 11 * * 0"
  workflow_dispatch:

permissions:
  id-token: write # req'd for OIDC -> aws
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: NPM CI
        run: npm ci

      - name: Run sync:gtfs script (download zips and cook into JSON)
        id: sync-gtfs
        # Continue on error bcs we want to still continue if one feed fails and the rest pass.
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run sync:gtfs

      - name: Configure AWS credentials (OIDC)
        id: aws-creds
        # Run only if at least one feed cooked a current.json
        if: hashFiles('data/gtfs/**/current.json') != ''

        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GTFS_SYNC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Upload cooked GTFS files to S3
        if: steps.aws-creds.outcome == 'success'
        env:
          BUCKET: ${{ vars.GTFS_S3_BUCKET }}
        run: |
          # No --delete: a failed feed must leave last week's objects in S3.
          for dir in data/gtfs/*; do
            [ -d "$dir" ] || continue
            id=$(basename "$dir")
            if [ ! -f "$dir/current.json" ] || [ ! -f "$dir/current.zip" ]; then
              echo "skip $id (incomplete)"
              continue
            fi
            aws s3 sync "$dir/" "s3://${BUCKET}/gtfs/${id}/" --exclude "incoming.*" --exclude "previous.*"
            echo "uploaded $id"
          done

      - name: Fail if any feed failed
        # If fail because of specific feed fails, we want to assume this workflow is a fail so Admin can investigate.
        if: steps.sync-gtfs.outcome == 'failure'
        run: exit 1
