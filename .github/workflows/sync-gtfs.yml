# Weekly GTFS cook on a GitHub runner, then rsync to Lightsail.
# Secrets: LIGHTSAIL_HOST, LIGHTSAIL_SSH_KEY. Optional: LIGHTSAIL_USER (default ubuntu).
name: Sync GTFS

on:
  schedule:
    # GitHub cron is UTC only. 11:00 UTC Sunday = Sunday 3am PST / 4am PDT (Vancouver).
    - cron: "0 11 * * 0"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: NPM CI
        run: npm ci

      - name: Run sync:gtfs script (download zips and cook into JSON)
        id: sync-gtfs
        # Continue on error bcs we want to still continue if one feed fails and the rest pass.
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run sync:gtfs

      - name: Setup SSH
        id: setup-ssh
        # Run step only if GTFS files were cooked successfully into current.json
        if: hashFiles('data/gtfs/**/current.json') != ''
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.LIGHTSAIL_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync to Lightsail
        # run if prev step success
        if: steps.setup-ssh.outcome == 'success'
        run: |
          HOST="${{ secrets.LIGHTSAIL_HOST }}"
          USER="${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}"
          SSH="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"

          # Rsync to a temp folder on Lightsail first. This is to avoid rsync issues in the middle of large file transfer.
          # --delete is ok because we're deleting the old files.
          rsync -avz --delete \
            -e "$SSH" \
            data/gtfs/ \
            "${USER}@${HOST}:/tmp/gtfs-incoming/"

          # Move files from tmp to actual GTFS dir in Lightsail.
          # $SSH "${USER}@${HOST}" ' COMMANDS ' ===> is running the commands INSIDE the lightsail server.
          $SSH "${USER}@${HOST}" '
            DEST=/var/lib/ridendine/gtfs
            STAGING=/tmp/gtfs-incoming
            mkdir -p "$DEST"

            # Loop through each directory in staging
            for dir in "$STAGING"/*; do
              # Quick check to see if both current.json and current.zip exist, otherwise skip.
              if [ ! -f "$dir/current.json" ] || [ ! -f "$dir/current.zip" ]; then
                echo "skip $id (incomplete)"
                continue
              fi
              # Check if directory exists, otherwise skip.
              if [ ! -d "$dir" ]; then
                echo "skip $id (directory not found)"
                continue
              fi
              id=$(basename "$dir")
              mkdir -p "$DEST/$id"

              # Move current.* files to previous.* files.
              [ -f "$DEST/$id/current.json" ] && mv -f "$DEST/$id/current.json" "$DEST/$id/previous.json"
              [ -f "$DEST/$id/current.zip" ] && mv -f "$DEST/$id/current.zip" "$DEST/$id/previous.zip"

              # Move new files to current.* files.
              [ -f "$dir/current.json" ] && mv -f "$dir/current.json" "$DEST/$id/current.json"
              [ -f "$dir/current.zip" ] && mv -f "$dir/current.zip" "$DEST/$id/current.zip"
              echo "updated $id"
            done
            rm -rf "$STAGING"
          '

      - name: Fail if any feed failed
        # If fail because of specific feed fails, we want to assume this workflow is a fail so Admin can investigate.
        if: steps.sync-gtfs.outcome == 'failure'
        run: exit 1
